name: Docker Build using run commands

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u saadi092 --password-stdin

      - name: Build Docker image
        run: docker build -t saadi092/bse7_56-run:latest .

      - name: Verify image is created
        run: docker images

      - name: Push image to Docker Hub
        run: docker push saadi092/bse7_56-run:latest